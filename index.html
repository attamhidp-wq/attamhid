<style>
:root{--bg:#f6f7fa;--sf:#fff;--tx:#14213d;--mu:#5b6578;--pr:#13306b;--ac:#1d8fe0;--bd:#d9deea;--ok:#117a45;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--sf:#172038;--tx:#e8ecf6;--mu:#9aa6c0;--pr:#7fb2ff;--ac:#4aa8f0;--bd:#2a3556;--ok:#4cc58a;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1424;--sf:#172038;--tx:#e8ecf6;--mu:#9aa6c0;--pr:#7fb2ff;--ac:#4aa8f0;--bd:#2a3556;--ok:#4cc58a;--er:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif}
h1,h2,h3{font-family:Amiri,'IBM Plex Sans Arabic',serif;color:var(--pr);margin:.3em 0}
h1{font-size:2.4rem;line-height:1.3}h2{font-size:1.7rem}
a{color:var(--ac);cursor:pointer}
header{background:var(--sf);border-bottom:3px solid var(--pr);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:6px;padding:8px 14px;flex-wrap:wrap}
.nav img{height:58px;margin-inline-end:auto}
.nav a{padding:6px 10px;border-radius:6px;color:var(--tx);text-decoration:none;font-size:.9rem}
.nav a.on,.nav a:hover{background:var(--pr);color:var(--sf)}
main{max-width:1100px;margin:auto;padding:22px 14px 60px}
.hero{background:var(--pr);color:#fff;border-radius:10px;padding:34px 26px;display:grid;gap:10px}
.hero h1{color:#fff}.hero p{max-width:60ch;margin:0;opacity:.9}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin:16px 0}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:16px}
.box h3{margin-top:0}.mu{color:var(--mu);font-size:.88rem}
.btn{background:var(--pr);color:var(--sf);border:0;border-radius:6px;padding:8px 16px;font:inherit;cursor:pointer;font-size:.9rem}
.btn.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}.btn.d{background:var(--er);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:end}
label{display:grid;gap:3px;font-size:.85rem;color:var(--mu)}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);width:100%}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}th{color:var(--pr)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.78rem;background:var(--bd)}
.tag.ok{background:var(--ok);color:#fff}.tag.er{background:var(--er);color:#fff}
.msg{padding:12px;border-radius:8px;border:1px solid var(--ok);margin:12px 0;background:var(--sf)}.msg.er{border-color:var(--er)}
#mod{position:fixed;inset:0;background:#000a;display:none;z-index:9;overflow:auto;padding:16px}
#mod .in{background:var(--sf);border-radius:8px;padding:12px;max-width:1040px;margin:auto}
#pvw{overflow:auto;border:1px solid var(--bd);margin:10px 0}
.cert{width:1000px;min-height:700px;background:#fff;color:#14213d;position:relative;display:flex;direction:rtl;font-family:Amiri,serif;overflow:hidden}
.cert .sd{width:230px;background:linear-gradient(#0f2a5e,#2a5a96);color:#fff;display:grid;align-content:space-between;justify-items:center;padding:26px 14px;text-align:center;font-family:'IBM Plex Sans Arabic',sans-serif}
.cert .sd b{font-size:19px;line-height:1.6}.cert .sd img.q{background:#fff;padding:6px;width:150px;height:150px}
.cert .bd{flex:1;padding:30px 44px;display:flex;flex-direction:column;text-align:center}
.cert .bd h2{font-size:54px;margin:6px 0;color:#0f2a5e}.cert .bd .rn{text-align:start;font:600 14px 'IBM Plex Sans Arabic'}
.cert .nm{font-size:34px;color:#1d6fb8;font-weight:700;margin:4px 0}
.cert p{font-size:21px;margin:4px 0;line-height:1.6}.cert .en{font:13px/1.5 'IBM Plex Sans Arabic';color:#445}
.cert .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:18px}
.cert .ft img{height:90px}.cert .ft .sg{height:70px}
.idc{width:540px;height:330px;background:#fff;color:#14213d;border:6px solid #13306b;border-radius:14px;direction:rtl;padding:14px 18px;display:grid;gap:4px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;align-content:start}
.idc img{height:64px;justify-self:start}.idc h3{margin:0;font-size:22px}
@media(max-width:600px){h1{font-size:1.8rem}}

:root{--gd:#a8812f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--gd:#d9b45f}}
:root[data-theme="dark"]{--gd:#d9b45f}
body{line-height:1.85}
h1,h2,h3{font-family:Amiri,'IBM Plex Sans Arabic',serif;font-weight:700}
h1{font-size:2.8rem}h2{font-size:1.9rem;border-bottom:2px solid var(--gd);display:inline-block;padding-bottom:2px}
header{border-bottom:0;box-shadow:0 3px 0 var(--gd)}
.nav a{font-weight:500;border-radius:4px}
.hero{background:radial-gradient(circle at 12% 18%,#ffffff18 0 2px,transparent 3px) 0 0/36px 36px,linear-gradient(135deg,#0c1f4a,#1b4a8a);border-radius:6px;padding:44px 30px}
.hero p{font-size:1.1rem}
.box{border-radius:4px;border-top:3px solid var(--gd)}
.btn{border-radius:4px;font-weight:500;transition:transform .12s,opacity .12s}.btn:hover{opacity:.88}.btn:active{transform:translateY(1px)}
th{background:color-mix(in srgb,var(--bd) 35%,transparent)}
tr:nth-child(even) td{background:color-mix(in srgb,var(--bd) 16%,transparent)}
.cert .en{font:italic 600 17px/1.5 'Cormorant Garamond',Georgia,serif;color:#33415c}
.cert .bd{margin:14px;border:2px solid #b8923a;outline:1px solid #b8923a;outline-offset:-8px}
.cert h2{font-size:58px}.cert h2::after{content:"";display:block;width:150px;height:3px;background:#b8923a;margin:4px auto}
.cert .nm{font-size:40px}
.cert .nm[dir=ltr]{font:700 32px 'Cormorant Garamond',Georgia,serif!important}

#pvw>*{zoom:var(--z,1)}
.cert2{width:1123px;min-height:794px;background:#fffdf8;color:#14213d;position:relative;direction:rtl;font-family:Amiri,serif;overflow:hidden}

.cert2 .in{position:relative;margin:16px;border:4px solid var(--a);outline:1px solid #b8923a;outline-offset:-10px;min-height:762px;padding:30px 56px 24px;display:flex;flex-direction:column;text-align:center}

.cert2 .hd .enm{font:700 17px/1.4 'Cormorant Garamond',Georgia,serif;color:var(--a);text-align:left}
.cert2 h2{display:block;border:0;font-size:64px;margin:8px 0 0;color:var(--a);line-height:1.3}
.cert2 .orn{display:flex;align-items:center;justify-content:center;gap:12px;color:#b8923a}

.cert2 .bdy{padding-top:6px}

.cert2 .en{font:italic 600 17px/1.5 'Cormorant Garamond',Georgia,serif;color:#33415c;margin:4px 0}
.cert2 table{font-size:16px}.cert2 th{color:var(--a);background:none}.cert2 td{color:#14213d}.cert2 tr td{background:none!important}
.cert2 .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;padding-top:14px}
.cert2 .sgn{text-align:center;font-size:18px;min-width:310px;line-height:1.5}

.cert2 .cols{display:grid;grid-template-columns:1fr 1fr;gap:30px;text-align:start;margin-top:6px}
.cert2 .cols p{font-size:20px;line-height:1.7}
.cert2 .encol{direction:ltr;text-align:left;border-right:1px solid #b8923a88;padding-right:30px;font-family:'Cormorant Garamond',Georgia,serif}

.cert2 .cols .nm{font-size:36px}.cert2 .encol .nm{font-size:30px}
.cert2 .nt{font:11px/1.5 'IBM Plex Sans Arabic',sans-serif;color:#556;border-top:1px solid #b8923a88;margin-top:10px;padding-top:6px}

.toast{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--pr);color:var(--sf);padding:10px 20px;border-radius:6px;z-index:30;display:none}
.cert2 .in{outline:none;padding-top:0}
.cert2 .fr2{position:absolute;inset:8px;border:1px solid #b8923a;pointer-events:none}
.cert2 .co{position:absolute;width:86px;height:86px;z-index:2}
.cert2 .co.a{top:4px;left:4px}.cert2 .co.b{top:4px;right:4px;transform:scaleX(-1)}.cert2 .co.c{bottom:4px;left:4px;transform:scaleY(-1)}.cert2 .co.d{bottom:4px;right:4px;transform:rotate(180deg)}
.cert2 .hb{margin:0 -56px 8px;padding:16px 70px;background:linear-gradient(100deg,var(--a),#0c1f4a);border-bottom:5px solid #b8923a;display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative}
.cert2 .hb .ar,.cert2 .hb .enm{color:#fff;font-size:20px}
.cert2 .hb img{height:76px;width:auto;flex:none;background:#fff;padding:6px 14px;border-radius:6px}
.cert2 h2{font-size:60px;margin-top:4px}
.cert2 .nm{display:inline-block;border-bottom:2px solid #b8923a;padding:0 30px 2px}
.cert2 .sl{width:138px;height:138px;border-radius:50%;background:radial-gradient(#fffdf8 60%,#ead9a6);border:3px double #b8923a;display:grid;place-items:center}.cert2 .sl img{height:106px}
.cw{width:880px;display:grid;gap:16px;padding:14px;background:#e6eaf2;direction:rtl;font-family:'IBM Plex Sans Arabic',sans-serif}
.cd{width:852px;height:540px;border-radius:26px;position:relative;overflow:hidden;color:#fff;padding:34px 42px;text-align:start}

.cd .bd2{display:flex;gap:30px;margin-top:34px;align-items:flex-start}
.cd .ph{width:150px;height:184px;flex:none;border-radius:12px;background:#ffffff22;border:2px solid #f0dca0;display:grid;place-items:center;font:700 70px Amiri,serif;color:#f0dca0}
.cd h3{color:#fff;font:700 42px/1.3 Amiri,serif;margin:0}
.cd .id{font:700 30px 'IBM Plex Sans Arabic',sans-serif;letter-spacing:2px;color:#f0dca0;direction:ltr;text-align:right;margin:6px 0}
.cd p{font-size:20px;margin:2px 0;line-height:1.6}
.cd .qrb{position:absolute;bottom:34px;left:42px;background:#fff;padding:6px;border-radius:8px}.cd .qrb img{width:124px;height:124px;display:block}
.cd .gl{position:absolute;bottom:0;left:0;right:0;height:14px;background:linear-gradient(90deg,#b8923a,#f0dca0,#b8923a)}
.cd.bk{background:#fffdf8 url(data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2264%22%20height%3D%2264%22%3E%3C%2Fsvg%3E);color:#14213d;border:2px solid #b8923a}
.cd.bk p{margin-top:22px}.cd.bk .sg2{position:absolute;bottom:40px;right:42px;display:flex;align-items:center;gap:14px;font-size:17px;line-height:1.6}.cd.bk .sg2 img{height:80px}

.cert3{height:794px;min-height:794px;background:#fff;display:flex}
.cert3 .sb{width:262px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:34px 18px 126px;text-align:center;color:#fff;background-size:64px 64px,cover}

.cert3 .nmz{font:700 25px/1.7 'Reem Kufi',Amiri,serif}
.cert3 .qq{background:#fff;border-radius:18px;padding:10px 10px 6px;color:#0c1f4a;font:600 13px 'IBM Plex Sans Arabic',sans-serif}
.cert3 .qq img{width:170px;height:170px;display:block}
.cert3 .mn{flex:1;padding:20px 40px 70px;display:flex;flex-direction:column;background-repeat:no-repeat;background-size:cover;text-align:center;min-width:0}
.cert3 .rno{font:500 15px 'IBM Plex Sans Arabic',sans-serif;color:var(--a);text-align:left}
.cert3 h2{display:block;border:0;font:700 66px/1.3 'Reem Kufi',Amiri,serif;color:var(--a);margin:2px 0 0}
.cert3 .cols{gap:24px}.cert3 .encol{padding-right:24px}
.cert3 .cols p{font-size:19px}.cert3 .encol p{font-size:21px}
.cert3 .ft{direction:ltr;justify-content:flex-start;gap:46px;padding-top:8px}
.cert3 .sgn{direction:rtl;min-width:300px;font-size:17px}
.cert3 .sgn small{font:12px 'IBM Plex Sans Arabic',sans-serif;color:#556}
.cert3 .sl{width:124px;height:124px}.cert3 .sl img{height:94px}
.cert3 .nt{position:absolute;left:40px;right:302px;bottom:34px;margin:0;font-size:10px}
.cert3 .dg{position:absolute;right:0;bottom:26px;width:150px;height:100px}
.cert3 .bar{position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(90deg,#0c1f4a,var(--a))}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}.tb input{flex:1;min-width:220px}.tb select{width:auto;min-width:130px}

.cert3 .sl{width:auto;height:auto;border:0;border-radius:0;background:none}.cert3 .sl img{height:118px}
.cert2 .sgn img{height:62px;max-width:210px;object-fit:contain}
.cert3 .sb .lg{width:230px}.cert3 .sbo{color:#d9b45f;font-size:34px}
.cert3 .one p{font-size:24px;line-height:1.9}.cert3 .one .nm{font-size:48px}
footer{max-width:1100px;margin:auto;padding:16px 14px 40px;border-top:2px solid var(--gd);color:var(--mu);font-size:.9rem;text-align:center}
.cert3 .rvk{position:absolute;z-index:6;top:280px;left:170px;transform:rotate(-16deg);font:700 120px/1.2 'Reem Kufi',Amiri,serif;color:#b3261e;border:10px solid #b3261e;border-radius:14px;padding:0 44px;opacity:.5;pointer-events:none}
.nw{border-inline-start:4px solid var(--ac)}.sx{margin:8px 0}.sx i{display:block;height:8px;background:var(--ac);border-radius:4px;margin-top:3px}footer a{margin:0 4px}textarea{width:100%;min-height:70px;font:inherit}

async function dl(f){const w=document.createElement('div');w.style.cssText='position:fixed;left:-3000px;top:0';w.innerHTML=cur;document.body.appendChild(w);
try{const el=w.firstElementChild;let blob;
if(f=='svg'){const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n'),W=el.offsetWidth,H=el.offsetHeight;

else{await document.fonts.ready;const cv=await html2canvas(el,{scale:3,backgroundColor:'#fff',useCORS:true});
if(f=='pdf'){const{jsPDF}=window.jspdf;const d=new jsPDF({orientation:'l',unit:'px',format:[cv.width/3,cv.height/3]});d.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,cv.width/3,cv.height/3);blob=d.output('blob')}

function csvParse(t){t=t.replace(/^﻿/,'');const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';rows.push(r);r=[]}else f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows.filter(r=>r.some(x=>x!==''))}
const AR_H={'رقم السجل':'rec','النوع':'type','الاسم':'name','البرنامج':'prog','التقدير':'grade','الساعات':'hours','التاريخ':'date'};
function csvRestore(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();

let add=0,skip=0,bad=0;const have=new Set(S.certs.map(c=>c.rec));
rows.slice(1).forEach(row=>{const o={};keys.forEach((k,i)=>{if(k)o[k]=(row[i]??'').trim()});if(!o.rec){bad++;return}if(have.has(o.rec)){skip++;return}
let t=o.type;if(!CT[t]){t=Object.keys(CT).find(k=>CT[k][0]==t)||'part'}o.type=t;
let pg=S.programs.find(p=>p.id==o.prog)||S.programs.find(p=>p.name==o.prog)||S.programs[0];o.prog=pg?pg.id:0;
o.hours=o.hours===''||o.hours==null||isNaN(+o.hours)?o.hours:+o.hours;o.revoked=['1','true','نعم'].includes(String(o.revoked||'').toLowerCase());if(!o.revoked){delete o.reason;delete o.rdate}
o.date=o.date||new Date().toISOString().slice(0,10);if(!o.name){bad++;return}
S.certs.push(o);have.add(o.rec);add++;const m=o.rec.match(/(\d+)$/);if(m&&+m[1]>=S.n.rec)S.n.rec=+m[1]+1});
save();flash=`الاستعادة: أُعيدت <b>${add}</b> وثيقة، وتُجوهلت <b>${skip}</b> موجودة مسبقاً${bad?'، وتعذّرت '+bad+' صفوف ناقصة':''}.`;go()}
catch(e){toast('ملف CSV غير صالح: يجب أن يكون الملف الذي نُزّل سابقاً من تبويب الشهادات')}};r.readAsText(f,'utf-8');inp.value=''}

function rmBg(c){const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){const m=Math.min(p[i],p[i+1],p[i+2]);if(m>225)p[i+3]=0;else if(m>170)p[i+3]=Math.min(p[i+3],(225-m)/55*255)}x.putImageData(d,0,0);return c}
function trimC(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;let a=w,b=h,r=-1,t=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>12){if(x<a)a=x;if(x>r)r=x;if(y<b)b=y;if(y>t)t=y}if(r<0||(a==0&&b==0&&r==w-1&&t==h-1))return c;const n=document.createElement('canvas');n.width=r-a+1;n.height=t-b+1;n.getContext('2d').drawImage(c,a,b,n.width,n.height,0,0,n.width,n.height);return n}
