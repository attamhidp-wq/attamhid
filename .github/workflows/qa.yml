# v228 — فحص الجودة والأداء على الموقع الحي (يدوي فقط): صفحات بثلاث لغات، حمل خفيف، Lighthouse، ترويسات
name: qa
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'مسارات Lighthouse مفصولة بمسافة (فارغ = الافتراضي)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2 lighthouse@12.2.1
          timeout 240 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Pages, load and headers
        run: node tools/qa.js
      - name: Lighthouse
        run: |
          CH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          U="${{ github.event.inputs.urls }}"; [ -z "$U" ] && U="/ /programs/diploma.html /student-services/ /en/graduates/"
          for u in $U; do
            for ff in mobile desktop; do
              P=""; [ "$ff" = desktop ] && P="--preset=desktop"
              npx lighthouse "https://attamhid.com$u" --chrome-path="$CH" --chrome-flags="--headless=new --no-sandbox" $P --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=lh.json --quiet || continue
              node -e "const r=require('./lh.json');const c=r.categories,a=r.audits;console.log('LH','$u','$ff',Object.keys(c).map(k=>k+':'+Math.round(c[k].score*100)).join(' '),'LCP:'+a['largest-contentful-paint'].displayValue,'CLS:'+a['cumulative-layout-shift'].displayValue,'TBT:'+a['total-blocking-time'].displayValue,'FCP:'+a['first-contentful-paint'].displayValue);const f=Object.values(a).filter(x=>x.score!==null&&x.score<0.9&&x.scoreDisplayMode!=='informative'&&x.scoreDisplayMode!=='notApplicable').map(x=>x.id).slice(0,25);console.log('LHFAIL','$u','$ff',f.join(','));const mt=(a['mainthread-work-breakdown'].details||{}).items||[];console.log('LHMAIN','$u','$ff',mt.map(x=>x.groupLabel+':'+Math.round(x.duration)).join(' '));const lt=((a['long-tasks']||{}).details||{}).items||[];console.log('LHLONG','$u','$ff',lt.slice(0,8).map(x=>String(x.url).replace(/^https?:\/\/[^/]+/,'')+'@'+Math.round(x.startTime)+'+'+Math.round(x.duration)).join(' '));const bu=((a['bootup-time']||{}).details||{}).items||[];const cc=((a['color-contrast']||{}).details||{}).items||[];if(cc.length)console.log('LHCC','$u','$ff',cc.slice(0,10).map(x=>((x.node||{}).selector||'')+' «'+String((x.node||{}).snippet||'').slice(0,80)+'» '+String((x.node||{}).explanation||'').slice(0,160)).join(' || '));const ts=((a['target-size']||{}).details||{}).items||[];if(ts.length)console.log('LHTS','$u','$ff',ts.slice(0,8).map(x=>((x.node||{}).selector||'')).join(' | '));console.log('LHBOOT','$u','$ff',bu.slice(0,6).map(x=>String(x.url).replace(/^https?:\/\/[^/]+/,'')+':'+Math.round(x.total)).join(' '))"
            done
          done
