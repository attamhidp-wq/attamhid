# v134 — تحديث صفحات البرامج القابلة للفهرسة وخريطة الموقع تلقائياً من بيانات الموقع العامة
name: seo-pages
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate pages
        run: python3 tools/seo.py --fetch
      - name: Commit changes
        run: |
          git config user.name "ati-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs sitemap.xml robots.txt tools/seo-data.json
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "تحديث صفحات البرامج لمحركات البحث" && git push; fi
